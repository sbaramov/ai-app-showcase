spring.cloud.openfeign.client.config.tavily.url=https://api.tavily.com
spring.cloud.openfeign.client.config.tavily.connect-timeout=5000
spring.cloud.openfeign.client.config.tavily.read-timeout=10000
spring.cloud.openfeign.client.config.tavily.default-request-headers.Authorization=Bearer \${TAVILY_API_KEY}
