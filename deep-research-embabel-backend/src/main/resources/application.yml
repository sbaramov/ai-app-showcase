spring:
  config:
    import: optional:file:${user.dir}/../etc/.env.properties
  application:
    name: deep-research-embabel-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/deep_research
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          tavily:
            url: "https://api.tavily.com"
            connect-timeout: 5000
            read-timeout: 10000
            default-request-headers:
              Authorization: "Bearer ${TAVILY_API_KEY}"
embabel:
  agent:
    platform:
      models:
        openai:
          max-attempts: 5
      scanning:
        bean: true
  models:
    default-llm: ministral-3:8b
    default-embedding-model: qwen3-embedding
  observability:
    enabled: true
    service-name: deep-research
server:
  port: 8081

app:
  allowed-origin-patterns:
    - "*"
  system-prompts:
    plan: >-
      You are a helpful research assistant. Given a query, come up with a set of web searches
      to perform to best answer the query. Generate up to 3 search queries.
    search: >-
      You are a research assistant. Given a search term, you search the web for that term and 
      produce a concise summary of the results. The summary must 2-3 paragraphs and less than 300 
      words. Capture the main points. Write succinctly, no need to have complete sentences or good 
      grammar. This will be consumed by someone synthesizing a report, so its vital you capture the 
      essence and ignore any fluff. Do not include any additional commentary other than the summary itself.
    report: >-
      You are a senior researcher tasked with writing a cohesive report for a research query. 
      You will be provided with the original query, and some initial research done by a research assistant.\n
      
      You should first come up with an outline for the report that describes the structure and 
      flow of the report. Then, generate the report and return that as your final output.\n
      
      The final output should be in markdown format, and it should be lengthy and detailed. Aim 
      for 5-10 pages of content, at least 1000 words.
      
      **ALWAYS** escape double quotes with backslash.
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  langfuse:
    enabled: true
    endpoint: "${EMBABEL_LANGFUSE_BASE_URL}/api/public/otel"
#    endpoint: "${EMBABEL_LANGFUSE_BASE_URL}"
    public-key: "${EMBABEL_LANGFUSE_PROJECT_PUBLIC_KEY}"
    secret-key: "${EMBABEL_LANGFUSE_PROJECT_SECRET_KEY}"
#  otlp:
#    tracing:
#      endpoint: http://localhost:3000/api/public/otel/v1/traces
#      transport: http/protobuf
#      headers:
#        x-langfuse-ingestion-version: "4"
---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    org.springframework.messaging: INFO
    org.springframework.web.socket: INFO
    com.embabel.agent: INFO
---
spring:
  config:
    activate:
      on-profile: "gemma4"
embabel:
  models:
    default-llm: "gemma4:31b-cloud"
---
spring:
  config:
    activate:
      on-profile: "qwen3.5"
embabel:
  models:
    default-llm: "qwen3.5:397b-cloud"
---
spring:
  config:
    activate:
      on-profile: "deepseek"
embabel:
  models:
    default-llm: "deepseek-v4-flash:cloud"
