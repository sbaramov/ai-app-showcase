spring:
  config:
    import: optional:file:../etc/.env.properties
  application:
    name: deep-search-embabel-backend
  cloud:
    openfeign:
      client:
        config:
          tavily:
            url: "https://api.tavily.com"
            connect-timeout: 5000
            read-timeout: 10000
            default-request-headers:
              Authorization: "Bearer ${TAVILY_API_KEY}"
embabel:
  agent:
    platform:
      models:
        ollama:
          base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      scanning:
        bean: true
  models:
    default-llm: gemma4:e4b
    llms:
      plan: gemma3:4b
      search: gemma4:e4b
      report: gemma4:e4b
server:
  port: 8081

---
spring:
  config:
    activate:
      on-profile: local
logging:
  level:
    org.springframework.messaging: DEBUG
    org.springframework.messaging.simp: DEBUG
    org.springframework.web.socket: DEBUG
    com.embabel.agent: DEBUG
embabel:
  observability:
    enabled: true