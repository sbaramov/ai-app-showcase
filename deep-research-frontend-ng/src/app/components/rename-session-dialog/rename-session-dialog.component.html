<h2 mat-dialog-title>Rename Session</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Session name</mat-label>
    <input matInput [(ngModel)]="newName" (keydown.enter)="onConfirm()" />
  </mat-form-field>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" (click)="onConfirm()" [disabled]="!newName.trim()">
    Rename
  </button>
</mat-dialog-actions>
