@if (progressMessages().length > 0) {
  <div class="progress-container">
    <div class="progress-header">
      <span>Research Progress</span>
      <button mat-icon-button (click)="clearProgress()" aria-label="Clear progress">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <mat-progress-bar
      mode="indeterminate"
      [value]="progressValue()"
      color="accent"
    ></mat-progress-bar>

    <mat-list>
      @for (message of progressMessages(); track message.processId + message.message) {
        <mat-list-item>
          <mat-icon matListItemIcon>circle</mat-icon>
          <span matListItemTitle>{{ message.message }}</span>
        </mat-list-item>
      }
    </mat-list>
  </div>
}
