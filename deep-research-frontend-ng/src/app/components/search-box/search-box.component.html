<div class="search-container">
  <mat-form-field appearance="fill" class="search-field">
    <mat-label>Enter research topic</mat-label>
    <input
      matInput
      type="text"
      [formControl]="searchForm.controls.topic"
      placeholder="What would you like to research?"
    />
    <mat-hint>Minimum 3 characters</mat-hint>
    @if (searchForm.controls.topic.hasError('required')) {
      <mat-error>Topic is required</mat-error>
    }
    @if (searchForm.controls.topic.hasError('minlength')) {
      <mat-error>Topic must be at least 3 characters</mat-error>
    }
  </mat-form-field>

  <div class="button-group">
    <button
      mat-raised-button
      color="primary"
      (click)="onSubmit()"
      [disabled]="searchForm.invalid || isSearching()"
    >
      @if (isSearching()) {
        <ng-container><mat-icon>search</mat-icon></ng-container>
      }
      {{ isSearching() ? 'Researching...' : 'Search' }}
    </button>

    @if (isFormSubmitted()) {
      <button
        mat-stroked-button
        (click)="onReset()"
      >
        Reset
      </button>
    }
  </div>
</div>
