@if (report()) {
  <div class="report-container">
    <mat-card>
      <mat-card-title>Research Report</mat-card-title>
      
      @if (isLoading()) {
        <mat-progress-bar mode="indeterminate" />
      }
      
      <mat-card-content>
        <app-markdown-renderer [content]="markdownContent()" />
        
        @if (followUpQuestions().length > 0) {
          <div class="follow-up-section">
            <span class="follow-up-label">Follow up with:</span>
            <div class="follow-up-chips">
              @for (question of followUpQuestions(); track $index) {
                <button
                  mat-chip
                  (click)="onFollowUpQuestionSelected(question)"
                  [disabled]="isLoading()"
                >
                  {{ question }}
                </button>
              }
            </div>
          </div>
        }
      </mat-card-content>
      
      <mat-card-actions align="end">
        <button
          mat-button
          matTooltip="Copy report to clipboard"
          (click)="copyToClipboard()"
          [disabled]="isLoading()"
        >
          <mat-icon>content_copy</mat-icon>
          Copy
        </button>
        <button
          mat-button
          matTooltip="Download as Markdown"
          (click)="downloadMarkdown()"
          [disabled]="isLoading()"
        >
          <mat-icon>file_download</mat-icon>
          Download
        </button>
      </mat-card-actions>
    </mat-card>
  </div>
} @else {
  <div class="no-report">
    <mat-card>
      <mat-card-title>No report available</mat-card-title>
      <mat-card-content>
        Run a search to generate a report.
      </mat-card-content>
    </mat-card>
  </div>
}
